<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طقس رماح مباشرة</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 25px 15px;
            direction: rtl;
        }
        .app-container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .time-display { 
            font-size: 12px; 
            color: #38bdf8; 
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .main-title { font-size: 28px; color: #fbbf24; margin: 5px 0 5px 0; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        h1 { font-size: 18px; color: #38bdf8; margin: 0 0 20px 0; font-weight: bold; }
        .data-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 18px;
            margin: 12px 0;
            border: 1px solid #1e293b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .title { font-size: 15px; color: #94a3b8; }
        .value { font-size: 38px; font-weight: bold; margin: 5px 0; }
        .value.wind { color: #38bdf8; }
        .value.temp { color: #f43f5e; }
        .value.dir { color: #10b981; font-size: 34px; }
        .value.loc { color: #a855f7; font-size: 24px; } 
        .unit { font-size: 15px; color: #64748b; }
        .btn-map {
            display: inline-block;
            background: #a855f7;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="time-display" id="fullDateTime">جاري تحديث الوقت والتاريخ...</div>
    <div class="main-title">🪂 طقس رماح مباشرة</div>
    <h1>رماح للطيران الشراعي</h1>
    
    <div class="data-card">
        <div class="icon">🌪️</div>
        <div class="title">سرعة الرياح الحالية</div>
        <div class="value wind" id="windSpeed">0.0</div>
        <div class="unit">كيلومتر / ساعة</div>
    </div>

    <div class="data-card">
        <div class="icon">🧭</div>
        <div class="title">اتجاه هبوب الرياح</div>
        <div class="value dir" id="windDir">جاري الرصد</div>
        <div class="unit">الاتجاه الجغرافي الرئيسي</div>
    </div>

    <div class="data-card">
        <div class="icon">🌡️</div>
        <div class="title">درجة حرارة الجو</div>
        <div class="value temp" id="temperature">0.0</div>
        <div class="unit">درجة مئوية °C</div>
    </div>

    <div class="data-card">
        <div class="icon">📍</div>
        <div class="title">موقع محطة الرصد</div>
        <div class="value loc" id="stationLocation">رماح للطيران الشراعي</div>
        <a id="mapLink" class="btn-map" href="https://google.com" target="_blank" style="display:inline-block;">🗺️ عرض على الخريطة</a>
    </div>
</div>

<script>
    // تم إصلاح المعرف هنا ليرتبط فوريّاً بسيرفرك الشخصي رقم 3448604
    const channelID = "3448604"; 

    function updateLiveTime() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('fullDateTime').innerText = "توقيت الرصد الحالي: " + now.toLocaleDateString('ar-EG', options);
    }
    setInterval(updateLiveTime, 1000);

    function fetchWeatherData() {
        const url = `https://thingspeak.com{channelID}/feeds.json?results=1`;
        
        fetch(url)
        .then(response => response.json())
        .then(data => {
            const lastFeed = data.feeds[0];
            if (lastFeed) {
                if(lastFeed.field1 !== null && lastFeed.field1 !== undefined) document.getElementById('windSpeed').innerText = parseFloat(lastFeed.field1).toFixed(1);
                if(lastFeed.field2 !== null && lastFeed.field2 !== undefined) document.getElementById('temperature').innerText = parseFloat(lastFeed.field2).toFixed(1);
                if(lastFeed.field3 !== null && lastFeed.field3 !== undefined) {
                    let dirText = lastFeed.field3;
                    if(dirText == "North") dirText = "شمال";
                    if(dirText == "North_East") dirText = "شمال شرقي";
                    if(dirText == "East") dirText = "شرق";
                    if(dirText == "South_East") dirText = "جنوب شرقي";
                    if(dirText == "South") dirText = "جنوب";
                    if(dirText == "South_West") dirText = "جنوب غربي";
                    if(dirText == "West") dirText = "غرب";
                    if(dirText == "North_West") dirText = "شمال غربي";
                    document.getElementById('windDir').innerText = dirText;
                }
            }
        })
        .catch(error => {
            console.log("في انتظار البث الرقمي للحساسات");
        });
    }

    fetchWeatherData();
    setInterval(fetchWeatherData, 15000);
</script>

</body>
</html>
